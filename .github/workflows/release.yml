name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and preview the release without publishing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch against main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be dispatched with ref=main (got ${{ github.ref }})."
          exit 1

  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: [guard, checks]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main has not advanced since dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main moved from $GITHUB_SHA to $head after dispatch; dispatch the release again."
            exit 1
          fi
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Release
        run: pnpm release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Summary
        if: inputs.dry_run
        run: echo "Dry run complete; nothing was published and no tag was created." >> "$GITHUB_STEP_SUMMARY"
