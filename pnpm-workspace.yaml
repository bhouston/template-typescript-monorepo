packages:
  - packages/*
  - apps/*

resolutionMode: highest

overrides:
  '@bhouston/sdk>zod': ^4
  conventional-changelog-conventionalcommits: 9.3.1

peerDependencyRules:
  allowedVersions:
    vite: 8.0.11

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  msw: true
  unrs-resolver: true

link-workspace-packages: true

minimumReleaseAgeExclude:
  - vitest-command-line
  - yargs-file-commands
  - tanstack-router-ga4
  - '@clidoc/core@1.1.0'
  - '@clidoc/yargs@1.1.0'
